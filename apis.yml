name: Atlantic Money
description: 'Atlantic Money is a London-based fintech, founded in 2020 by Robinhood
  alumni and backed by Index Ventures, offering international money transfers at a
  flat GBP 3 fee with the live mid-market exchange rate and no FX markup. The service
  supports transfers across ten currencies with direct bank deposits and standard
  or express delivery, for both consumers and businesses, and is authorized and regulated
  by the UK FCA as a payment institution. Atlantic Money is a consumer- and business-facing
  mobile and web application; it publishes no public developer API, OpenAPI, or SDK
  surface, so this network profile is limited to company identity, website property
  links, and probed domain-security posture.'
